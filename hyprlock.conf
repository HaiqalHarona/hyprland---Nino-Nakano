# =========================================================
# Hyprlock — Nino Nakano Theme
# =========================================================

background {
    monitor =
    path = /home/ninonakano/Pictures/Wallpapers/wallpaperhypr.jpg
    color = rgba(26, 15, 30, 1.0)
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Digital Clock
label {
    monitor =
    text = $TIME
    color = rgb(240, 111, 160)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Current Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B %Y')"
    color = rgb(160, 128, 160)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

# Butterfly Icon / Avatar
label {
    monitor =
    text = 🦋
    font_size = 30
    position = 0, -25
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(165, 74, 150)
    inner_color = rgb(26, 26, 36)
    font_color = rgb(240, 230, 240)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##a080a0"><i>Password...</i></span>
    hide_input = false
    rounding = 12
    check_color = rgb(240, 111, 160)
    fail_color = rgb(204, 36, 29)
    fail_text = <i>Incorrect ($ATTEMPTS)</i>
    fail_timeout = 1500
    fail_transition = 200
    capslock_color = rgb(240, 111, 160)
    numlock_color = -1
    bothlock_color = -1
    position = 0, -90
    halign = center
    valign = center
}
